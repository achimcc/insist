[package]
name = "insist"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Keep alerts open and escalating until a human acknowledges them"
repository = "https://github.com/achimcc/insist"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
hex = "0.4.3"
hmac = "0.13.0"
jiff = { version = "0.2.37", features = ["serde", "tzdb-bundle-always"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query", "stream"] }
sd-notify = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["test-util"] }
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"
